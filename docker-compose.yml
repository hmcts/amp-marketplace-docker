# API Marketplace locally: `docker compose up --build`, then http://localhost:3344

name: amp-marketplace

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d marketplace']
      interval: 3s
      timeout: 3s
      retries: 20

  # Mock Entra External ID; users and claims in entra-mock.json
  entra-mock:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.3
    environment:
      SERVER_PORT: '4600'
      JSON_CONFIG_PATH: /config/entra-mock.json
    volumes:
      - ./entra-mock.json:/config/entra-mock.json:ro
    ports:
      - '4600:4600'
      - '3344:3344' # web's port, as web shares this network

  service-api:
    build:
      context: ../service-api-marketplace
      dockerfile: ../amp-marketplace-docker/service.Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DATABASE: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASS: postgres
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web-api-marketplace
      dockerfile: ../amp-marketplace-docker/web.Dockerfile
    # Same network as the mock, so browser and server both reach it at localhost:4600
    network_mode: service:entra-mock
    environment:
      PORT: '3344'
      API_URL: http://service-api:8080
      SESSION_SECRET: local-session-secret
      ENTRA_CLIENT_ID: local-web-api-marketplace # any value; the mock does not check it
      ENTRA_CLIENT_SECRET: local-mock-only # any value; the mock does not check it
      ENTRA_AUTHORIZE_ENDPOINT: http://localhost:4600/00000000-0000-4000-8000-00000000c1a0/authorize
      ENTRA_TOKEN_ENDPOINT: http://localhost:4600/00000000-0000-4000-8000-00000000c1a0/token
      ENTRA_DISCOVERY_ENDPOINT: http://localhost:4600/00000000-0000-4000-8000-00000000c1a0/.well-known/openid-configuration
      ENTRA_REDIRECT_URI: http://localhost:3344/auth/callback
      ENTRA_POST_LOGOUT_REDIRECT_URI: http://localhost:3344/
    depends_on:
      entra-mock:
        condition: service_started
      service-api:
        condition: service_started

volumes:
  postgres-data:
